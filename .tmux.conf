# prefix + I pour installer les plugins

set-option -sa terminal-overrides ",xterm*:Tc"

# remplir le prefix par <C-r> + <Spc> 
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# autorise la souris
set -g mouse on
setw -g mouse on

set-option -g history-limit 10000

set -g default-terminal "tmux-256color"

set -ga terminal-overrides ",xterm-termite:Tc"

# pour copier du texte entre les panes avec le vi copy-mode-vi
# prefix+[ : entre en mode sélection
# v : commence le surlignage
# y : copie le surlignage
# p : copie dans n'importe quel pane(+ vim)
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Vim style pane selection
bind-key h select-pane -L
bind-key j select-pane -D 
bind-key k select-pane -U
bind-key l select-pane -R

#pour restaurer les sessions nvim
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes 'nvim yazi elia'

# setup catppuccin-tmux
set-option -g status-position top

# set -g @catppuccin_window_left_separator ""
# set -g @catppuccin_window_right_separator " "
# set -g @catppuccin_window_middle_separator " █"
# set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_left_separator "█"
set -g @catppuccin_window_right_separator "█ "
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_middle_separator "  █"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_status_modules_right "directory session battery date_time"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_date_time_text "%Y-%m-%d %H:%M:%S"

set -g @catppuccin_directory_text "#{pane_current_path}"

# plugins avec tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'tmux-plugins/tmux-battery'

run '~/.tmux/plugins/tpm/tpm'

